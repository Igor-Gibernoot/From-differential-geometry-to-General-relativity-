id: ch01-overview
title: Why This Course? The Big Questions
kind: concept
own: |
  - **Free fall removes gravity at a point, not between points.** Two nearby free particles with separation $\eta$ still accelerate relative to each other, through a curvature tensor $\mathrm{Riem}$:
    {{ $$\ddot\eta^\alpha = -\mathrm{Riem}^\alpha{}_{0\beta0}\,\eta^\beta .$$ }}
  - **Coordinates are labels; objects are not lists of numbers.** Doubling the basis halves a vector's components but doubles a gradient's:
    {{ $$x'^i = \tfrac12\,x^i ,\qquad \mathtt{x}'_i = 2\,\mathtt{x}_i .$$ }}
  - **Curvature is visible from inside.** On a sphere of radius $R$, a triangle of area $A$ has angle sum
    {{ $$\text{sum of angles} - \pi = \frac{A}{R^2} ,$$ }}
    and a carried arrow comes back turned by that excess.
  - **Time is geometry.** A clock moving at speed $v$ (with $c = 1$) for coordinate time $T$ records
    {{ $$\tau = T\sqrt{1-v^2} ,$$ }}
    so the straight worldline between two meetings has the *longest* proper time.
  - **Lengths and areas need a metric $g$.** A coordinate cell of side $\Delta$ has true area $\sqrt{\det g}\,\Delta^2$, not $\Delta^2$.
  - **Matter tells spacetime how to curve:**
    {{ $$G_{ab} = 8\pi G_N\,T_{ab} .$$ }}
    Geometry on the left, matter on the right: 10 component equations in 4 dimensions.

cards:
  - type: text
    id: hook
    title: A sentence you cannot yet read
    body: |
      General relativity, the theory of gravity, can be summed up in one sentence:

      > *Spacetime is a four-dimensional topological manifold with a smooth orientable atlas, carrying a torsion-free connection compatible with a Lorentzian metric and a time orientation, satisfying the Einstein equations.*

      Today it is a wall of jargon. By the end of this course every phrase will be a picture you can draw and a calculation you can do.

      This lesson is a **preview in questions**. We will meet the puzzles that force each phrase to exist, one at a time. Do not worry about getting them right: **guessing first is the point**. Each puzzle names the Level that solves it.

  - type: text
    id: q1-intro
    title: "Puzzle 1: what is gravity?"
    body: |
      Newton said gravity is a **force**: the Sun pulls the Earth, the Earth pulls an apple. It works beautifully. But there is a strange coincidence hiding in it: every object, heavy or light, falls with the **same** acceleration. A hammer and a feather fall together on the Moon.

      Einstein asked what that coincidence means. Let us run his thought experiment.

  - type: mcq
    id: elevator
    prompt: |
      You are in a closed elevator whose cable has just been cut, so it falls freely toward the ground (ignore air). Inside, you let go of a ball held at chest height. What do you see?
    options:
      - text: The ball stays beside you, floating
        correct: true
      - text: The ball drops to the floor
        feedback: |
          The ball falls, yes, but so do you, the elevator and the floor, all with the same acceleration. The floor never catches up with the ball.
      - text: The ball rises to the ceiling
        feedback: |
          Nothing pushes the ball up. Relative to the falling elevator it has no acceleration at all, so it neither rises nor sinks.
      - text: The ball drops, but slower than it would in a still elevator
        feedback: |
          Gravity is not weaker inside the elevator. It is just that everything inside accelerates equally, so the *relative* motion vanishes.
    explanation: |
      Inside the freely falling elevator, gravity is **undetectable**: you and the ball float. Einstein called this the happiest thought of his life. If falling erases gravity, then maybe gravity is not a force at all, but a property of the **paths** that free objects follow.

      But erasing is only exact at one point. The elevator is a little large: let us see what survives.

  - type: widget
    id: tides
    title: What falling cannot erase
    widget: falling-cloud
    config:
      GM: 8
      c0: [2, 0]
      r0: 0.2
      N: 12
      zoom: 5
      view: falling
      views: [sources, falling, both]
      arrows: true
      linear: false
      linearToggle: false
    body: |
      A ring of small free particles falls toward a heavy mass $M$. The panel follows the **center** of the ring as it falls (magnified ×5), so the center itself feels no gravity at all.

      Press **Play** and watch the ring. Then press **Sources** to see the real picture, and drag the grey handle farther from $M$ to repeat.

  - type: mcq
    id: tides-meaning
    prompt: |
      A ring of free particles falls toward a heavy mass. Seen from its own falling center (which feels no gravity), the ring is stretched toward the mass and squeezed sideways, into an egg. What does this tell us about gravity?
    options:
      - text: Falling removes gravity at one point, but not the *differences* between nearby points; those are what gravity leaves behind
        correct: true
      - text: There is a leftover force that falling can never cancel
        feedback: |
          Tempting, because we say "tidal force". But no particle is pushed by anything extra: each simply follows its own free path. The egg appears because those paths *drift apart*, since the pull is stronger on the near side than on the far side.
      - text: Falling removes gravity everywhere in the ring, so the ring stays a circle
        feedback: |
          That is true only for an infinitesimal ring. For any finite ring, the pull differs from place to place, and the circle distorts.
      - text: The mass attracts only the particles nearest to it
        feedback: |
          It attracts all of them. The point is that it attracts them *differently* (different strength and different direction).
    explanation: |
      This leftover, **how nearby free paths drift apart**, cannot be removed by any choice of falling frame. It is the physical signature of **curvature**. Einstein's idea: gravity *is* curvature of spacetime, and free particles follow the "straightest" paths in it, like two travellers walking due north from the equator, who start parallel and still meet at the pole.

      To make this a theory we need to answer, precisely: *what is curved? what does "straightest" mean? how do we measure curvature?* These are the questions of the whole course.

  - type: text
    id: q2-intro
    title: "Puzzle 2: what is real, and what is a label?"
    body: |
      To describe curved space we need coordinates. But coordinates on a curved surface always misbehave somewhere, and a good theory must not confuse **misbehaving labels** with **misbehaving physics**.

  - type: mcq
    id: pole
    prompt: |
      A traveller flies in a straight line over the geographic North Pole. Her longitude reads $10^\circ$ W just before the pole and $170^\circ$ E just after: it jumps by $180^\circ$ in an instant. What happened physically at the pole?
    options:
      - text: Nothing special; the longitude label simply fails to be defined at the pole
        correct: true
      - text: She made a sudden turn at the pole
        feedback: |
          A great-circle flight over the pole is as straight as any other. The jump is in the *number* we use, not in her motion.
      - text: The pole is a singular point of the Earth's surface
        feedback: |
          The surface of the Earth is perfectly smooth at the pole, as at any other point. Only the chart (latitude and longitude) breaks down there.
      - text: Longitude is not a real quantity, so no experiment can use it
        feedback: |
          Longitude is perfectly useful almost everywhere. The lesson is subtler: it is a **label** that works on *part* of the Earth, and we must not mistake its failures for features of the Earth.
    explanation: |
      Latitude and longitude are a **chart**: a way to label points by numbers on part of a surface. No single chart covers a sphere without a defect. This is why a "space that looks like flat $\mathbb{R}^d$ only locally" needs a careful definition, the **manifold** (Level 3). The same trap awaits at the horizon of a black hole, as we will see.

  - type: widget
    id: spin
    title: Straight, or curved?
    widget: rotating-grid
    config:
      omega: 1
      x0: [1, 0]
      v: [0, 0.5]
      t: 0
      tmax: 6.28
      view: both
      views: [inertial, rotating, both]
      forces: false
      forcesToggle: false
      velocity: false
      ghost: true
    body: |
      A particle with nothing pushing it moves in a straight line (left panel). The right panel describes the **same motion** using a coordinate grid that rotates, like the one fixed to a merry-go-round.

      Press **Play**, and also drag the starting point and the velocity handle. What does the path look like in each panel?

  - type: mcq
    id: which-real
    prompt: |
      A particle with no forces on it moves in a straight line in an inertial chart. In a chart that rotates, the same motion looks like a curling spiral. Which description is the "real" one?
    options:
      - text: Both are the same physical motion; "straight" must be defined without reference to any chart
        correct: true
      - text: The inertial one is real; the spiral is an illusion of the rotating observer
        feedback: |
          The rotating observer is not deceived; their numbers are correct for their labels. What the example shows is that "looks straight in my coordinates" depends on the labels, so it cannot be the definition of straight.
      - text: The spiral is real, because the rotating observer feels centrifugal and Coriolis forces
        feedback: |
          Those "forces" are a bookkeeping effect of the labels: they appear in the rotating chart and vanish in the inertial one. A force that disappears when you relabel is not physics.
      - text: 'Neither: with no forces, motion has no definite path'
        feedback: |
          The path is perfectly definite as a set of events. Only its *description* by numbers changes.
    explanation: |
      We need a chart-independent meaning of "straight line". It will come from a new structure, the **connection** (Level 6), and the "forces" of rotating frames will turn out to be its coefficients in a bad chart. Gravity itself will be revealed to live in the same object.

  - type: mcq
    id: horizon
    prompt: |
      The standard formulas for a black hole of mass $M$ have terms like $1/(1 - 2G_NM/r)$ (with $c = 1$) that blow up at $r = 2G_NM$, the horizon. A very large black hole's horizon is crossed by a freely falling astronaut. What does the astronaut notice locally at the crossing?
    options:
      - text: Nothing special; the blow-up belongs to the coordinates, not to the spacetime
        correct: true
      - text: Infinite tidal forces tear the astronaut apart at the horizon
        feedback: |
          The tides at the horizon are finite, and for a supermassive black hole they are tiny. The infinite tidal forces are at the central singularity $r = 0$, where the curvature really diverges.
      - text: Time stops for the astronaut, who freezes at the horizon
        feedback: |
          Time slows down for a *distant* observer watching, in their coordinates. The astronaut's own clock ticks normally and crosses the horizon in finite proper time.
      - text: The astronaut bounces back, since nothing can cross
        feedback: |
          Nothing can cross *outward*. Inward crossing is a perfectly ordinary event for the infalling observer.
    explanation: |
      **An infinity in a formula is not an infinity in nature.** To tell the two apart you need quantities that do not depend on the chart: **tensors**. Making this precise is the main job of the early levels.

  - type: text
    id: q3-intro
    title: "Puzzle 3: what is a vector?"
    body: |
      If the labels are arbitrary, the laws of physics must be written with objects that do not depend on them. The first such objects are **vectors** and **covectors**, and it is worth asking what we mean, since "a list of numbers" will turn out to be a trap.

  - type: numeric
    id: vector-doubling
    prompt: |
      Observer A uses a basis $(\hat{e}_1, \hat{e}_2)$ and writes the arrow $\mathcal{X} = 3\,\hat{e}_1 + 4\,\hat{e}_2$, so its components are $(3, 4)$. Observer B uses the basis $(2\hat{e}_1, 2\hat{e}_2)$, with arrows twice as long. What is the first component of the **same** arrow for B?
    answer: 1.5
    answerText: '1.5'
    wrong:
      - value: 6
        feedback: |
          Doubling the basis vectors does not double the numbers. Each of B's rulers is twice as long, so B needs *fewer* of them to reach the same tip.
      - value: 3
        feedback: |
          The arrow is the same, but B's basis is not, so the numbers must change. Check: $3\cdot 2\hat{e}_1$ is twice the arrow.
    hint: |
      Write the arrow as a multiple of $2\hat{e}_1$: how many of those fit in $3\hat{e}_1$?
    explanation: |
      $3\hat{e}_1 = 1.5\,(2\hat{e}_1)$ and $4\hat{e}_2 = 2\,(2\hat{e}_2)$, so B writes $(1.5, 2)$. The arrow is the same; its numbers changed **against** the basis. A vector is not its list of numbers.

  - type: numeric
    id: gradient-doubling
    prompt: |
      A temperature field $T$ increases by $6$ degrees for each unit step along $\hat{e}_1$ (observer A's first basis vector). Observer B's first basis vector is $2\hat{e}_1$. By how many degrees does $T$ increase per **B-step**?
    answer: 12
    answerText: '12'
    wrong:
      - value: 3
        feedback: |
          That would be the rule for a vector's components (they shrink when the basis grows). Here the quantity is *change per step*: a longer step gives a bigger change.
    hint: |
      A longer step covers more ground, so the temperature changes by more.
    explanation: |
      The components of a gradient rescale **with** the basis ($6 \to 12$), those of a vector **against** it ($3 \to 1.5$). They look like triples of numbers but live in different spaces: vectors, and their duals, **covectors**. Mixing them up is the commonest source of confusion in tensor calculus (Level 2, and Level 4 for curved space).

  - type: mcq
    id: why-tensors
    prompt: |
      Two physical quantities are written as tensors, and in one chart all their components agree. What can we conclude in any other chart?
    options:
      - text: They still agree, because tensor components transform by the same linear rule in both
        correct: true
      - text: Nothing; the components may differ in another chart
        feedback: |
          For arbitrary lists of numbers, yes. For tensors the components change by one common rule, so equal tensors stay equal.
      - text: They agree only if the new chart is a rotation of the old one
        feedback: |
          Any smooth change of chart works; rotations are just a special case.
    explanation: |
      This is **why** physics is written with tensors: an equation $A = B$ between tensors true in one chart is true in every chart. A law that is not a tensor equation would depend on the observer's labels.

  - type: text
    id: q4-intro
    title: "Puzzle 4: how do you differentiate on a curved space?"
    body: |
      Almost every law of physics involves a rate of change: velocity, acceleration, field gradients. All of them are limits of differences like
      $$\frac{V(p+h) - V(p)}{h} .$$
      On a flat table this is routine. What can go wrong on a sphere?

  - type: mcq
    id: subtract
    prompt: |
      On a sphere, $V(p)$ is an arrow tangent to the surface at $p$, and $V(p+h)$ is a tangent arrow at a nearby point. Why can we not simply subtract them to get a derivative?
    options:
      - text: They live in different tangent planes, so their difference is not defined without extra structure
        correct: true
      - text: The sphere has no derivatives
        feedback: |
          The sphere is perfectly smooth. Functions on it can be differentiated, and we will define derivatives of vectors too. The difficulty is specifically in comparing *vectors at different points*.
      - text: The difference is always zero on a sphere
        feedback: |
          Not at all. The issue is that the subtraction is not even defined, since the two arrows are in different spaces.
      - text: 'We can: just subtract the components in latitude and longitude'
        feedback: |
          Subtracting components gives a number that depends on the chart; two observers would disagree on the "derivative". We need a rule for carrying an arrow from $p+h$ back to $p$ first.
    explanation: |
      A rule for carrying arrows from point to point is exactly what a **connection** provides (Level 6). The derivative it defines is the **covariant derivative**, and it gives meaning to "straightest curve" (an *autoparallel*). Different connections give different derivatives, so which one physics uses must be decided by the theory.

  - type: mcq
    id: polar-constant
    prompt: |
      In the flat plane, the constant vector field "one unit to the right" has, in polar coordinates, components $(\cos\theta,\ -\sin\theta/r)$ in the basis $(\partial_r, \partial_\theta)$. These components vary from point to point. Does that mean the field changes?
    options:
      - text: No; the polar basis itself turns from point to point, so the components must change to keep the arrow fixed
        correct: true
      - text: Yes; non-constant components mean a non-constant field
        feedback: |
          This works in Cartesian coordinates, where the basis is the same everywhere. In polar coordinates the basis rotates from point to point, and the components compensate.
      - text: It depends on which observer measures it
        feedback: |
          Whether the field is constant is a fact about the arrows themselves. Only the numbers depend on the chart.
    explanation: |
      Differentiating components is not differentiating the vector: the extra terms from the changing basis are the **connection coefficients** (the Christoffel symbols). Chapter after chapter, this same pattern returns: components are shadows, and the true object is the geometry.

  - type: text
    id: q5-intro
    title: "Puzzle 5: can curvature be seen from inside?"
    body: |
      We said gravity is curvature. A bug living on a surface cannot see the room it sits in. Can it still tell that its world is curved?

      Take the sphere. Start at the North Pole and walk straight down a meridian to the equator. Turn left by $90^\circ$ and walk straight along the equator for a quarter of the way around the globe. Turn left by $90^\circ$ again and walk straight back to the pole.

  - type: numeric
    id: triangle
    prompt: |
      On a sphere, a triangle has one vertex at the North Pole and two vertices on the equator, a quarter of the way around from each other. Its sides are straight (great-circle) arcs. All three corners are right angles. What is the sum of its three angles, in degrees?
    answer: 270
    answerText: '270'
    wrong:
      - value: 180
        feedback: |
          $180^\circ$ is the answer on a flat plane, which is exactly the property that fails on a curved surface.
    hint: |
      Check each corner: the two meridians meet the equator at right angles, and meet each other at the pole at an angle equal to the quarter of the way around.
    explanation: |
      $90^\circ + 90^\circ + 90^\circ = 270^\circ$. A bug measuring angles on its own surface finds more than $180^\circ$, so it **knows** its world is curved, without ever leaving it. For a triangle of area $A$ on a sphere of radius $R$ the excess is $A/R^2$ (here $A = \pi R^2/2$, an eighth of the sphere, giving $\pi/2 = 90^\circ$).

  - type: numeric
    id: transport
    prompt: |
      Walk the triangle above (pole, down a meridian, a quarter of the equator, back up to the pole) carrying an arrow, never turning it relative to the path any more than the surface forces. You start with the arrow pointing along your path. Back at the start, by how many degrees is the arrow rotated compared to its starting direction?
    answer: 90
    answerText: '90'
    wrong:
      - value: 0
        feedback: |
          On a flat plane that is right: carrying an arrow around a closed loop returns it unchanged. On a curved surface it does not, and this is the very effect that measures curvature.
      - value: 270
        feedback: |
          $270^\circ$ is the angle sum, not the rotation. The arrow turns by the **excess** over the flat value $180^\circ$.
    hint: |
      Compare the sum of the angles with $180^\circ$.
    explanation: |
      The arrow comes back rotated by $270^\circ - 180^\circ = 90^\circ$: the angle excess. This **holonomy** around a loop is exactly what the curvature tensor measures (Level 6), and the same object governs the tides of Puzzle 1.

  - type: mcq
    id: embedding
    prompt: |
      We described the sphere's curvature using only angles and paths on the surface. Does a curved space have to bend inside a higher-dimensional space to be curved?
    options:
      - text: No; curvature is intrinsic and can be defined and measured entirely from inside
        correct: true
      - text: Yes; curvature is how a space bends in an extra dimension
        feedback: |
          That is how we visualize a sphere, because we happen to see it in 3D. But the angle sum, the rotation of carried arrows and the tides are all measured from inside. Spacetime is not bending into anything.
      - text: Only two-dimensional spaces can be intrinsically curved
        feedback: |
          Curvature exists in any dimension. Spacetime has four, and its curvature is what we call gravity.
    explanation: |
      This is why we study **manifolds** abstractly, with no reference to an ambient space: a four-dimensional spacetime is not embedded in anything. All we need are intrinsic structures, defined from within.

  - type: text
    id: q6-intro
    title: "Puzzle 6: how do you measure?"
    body: |
      Charts and connections give a notion of "straight", but nothing yet about **how long** a path is, **how much time** passes along it, or **which events can influence which**. These need the **metric**, a rule $g$ that turns two vectors into a number (their length-squared, or angle).

      In spacetime, the metric has a twist: time and space enter with opposite signs, which is what makes it *Lorentzian*. That sign changes everything about "the shortest path".

  - type: numeric
    id: twins
    prompt: |
      Twin A stays at rest for 10 years. Twin B leaves at speed $0.6$ (in units of the speed of light), turns around after 5 years of A's time, and comes back at the same speed, meeting A again at the end of A's 10 years. How many years pass on B's own clock?
    answer: 8
    answerText: '8'
    wrong:
      - value: 10
        feedback: |
          That would mean motion has no effect on elapsed time. Moving clocks run slow, and B moves relative to A for the entire trip.
      - value: 12.5
        feedback: |
          Moving clocks run *slow*, not fast: B's clock must record **less** than A's.
    hint: |
      A clock moving at speed $v$ ticks slow by the factor $\sqrt{1 - v^2}$. Here $v = 0.6$.
    explanation: |
      $\sqrt{1 - 0.36} = 0.8$, so B records $0.8\times 10 = 8$ years. Both twins travel between the same two events (the departure and the meeting), but the elapsed time depends on the **path**, and it is given by the metric.

  - type: mcq
    id: longest
    prompt: |
      In the twin example, A's straight path between the two meeting events records 10 years. B's detour records 8. In flat spacetime, among all timelike paths between the same two events, which one records the **most** time?
    options:
      - text: The straight one
        correct: true
      - text: The straight one records the least, as for ordinary distances
        feedback: |
          In Euclidean geometry the straight line is the *shortest* path. With the opposite sign for time, the straight worldline becomes the *longest*, since any detour must move faster and hence runs slower.
      - text: All of them record the same time
        feedback: |
          The twins show otherwise: the detour records 8 years.
    explanation: |
      Free particles follow the **geodesics** of the metric, curves of extremal proper time. Combined with a connection, this single principle replaces Newton's "force law" for gravity. Metric and connection are, a priori, independent: they become linked when we require the connection to be torsion-free and compatible with the metric, which singles out exactly one (the **Levi-Civita** connection). That is the "compatible" in the opening sentence.

  - type: text
    id: q7-intro
    title: "Puzzle 7: how do you add things up?"
    body: |
      Physics also needs totals: energy in a region, charge in a volume, the action of a field. These are integrals. But a coordinate box is not a unit of volume once the coordinates are only labels.

  - type: numeric
    id: area-ratio
    prompt: |
      On a globe, consider two small boxes, each spanning $1^\circ$ of latitude and $1^\circ$ of longitude: one on the equator and one at latitude $60^\circ$. What is the ratio (area of the box at $60^\circ$) / (area of the box at the equator)?
    answer: 0.5
    tolerance: 0.005
    answerText: '0.5'
    wrong:
      - value: 1
        feedback: |
          The boxes are "the same" in coordinates, but not on the globe: meridians come closer together toward the pole.
    hint: |
      Both boxes have the same height. How wide, in true distance, is $1^\circ$ of longitude at latitude $60^\circ$, compared to the equator?
    explanation: |
      The width shrinks by the factor $\cos 60^\circ = 0.5$ while the height is unchanged. The true area of a small coordinate cell of side $\Delta$ is $\sqrt{\det g}\,\Delta^2$, not $\Delta^2$: the metric supplies the conversion. Integration that does not depend on the chart is built from **volume forms** and requires the manifold to be **orientable** (Level 8).

  - type: text
    id: q8-intro
    title: "Puzzle 8: was Newton wrong?"
    body: |
      If gravity is curvature, then Newton's theory, which works so well for planets and projectiles, must be a limiting case of something geometric. It is, and seeing it is the bridge between what you know and what is new.

  - type: mcq
    id: newton-geometric
    prompt: |
      Is "gravity as geometry" an idea that exists only in Einstein's general relativity?
    options:
      - text: No; Newtonian gravity can also be written geometrically, with gravity stored in the connection of a spacetime whose time stays absolute
        correct: true
      - text: Yes; Newtonian gravity is intrinsically a force and cannot be geometric
        feedback: |
          It can. Newton–Cartan theory writes Newtonian gravity as a connection on a 4-dimensional manifold, with free fall as "straight" motion and tides as curvature.
      - text: No; but then the two theories are identical
        feedback: |
          They differ in a key way. Newtonian time is absolute and space stays flat; in general relativity the **metric** of spacetime itself responds to matter and mixes time with space.
    explanation: |
      The geometric version of Newton's gravity (Level 9) shows what carries over to Einstein's theory (a connection encoding free fall) and what is genuinely new (a dynamical, Lorentzian metric whose curvature is sourced by all forms of energy).

  - type: text
    id: q9-intro
    title: "Puzzle 9: what makes spacetime curve?"
    body: |
      The last piece is the law of motion for the geometry itself. Free particles follow geodesics; but what decides the curvature?

      Einstein's answer, **matter and energy**, is a single tensor equation:
      $$G_{ab} = 8\pi G_N\,T_{ab} .$$
      Here $G_N$ is Newton's constant, $T_{ab}$ is the **energy–momentum tensor** of matter, and $G_{ab}$ is the **Einstein tensor**, built from the curvature of the metric. Level 10 derives it from an action principle, as we will have done for geodesics in Level 7.

  - type: mcq
    id: einstein-meaning
    prompt: |
      In words, what does $G_{ab} = 8\pi G_N\,T_{ab}$ say?
    options:
      - text: Curvature of spacetime on the left is sourced by matter and energy on the right
        correct: true
      - text: The gravitational force between two masses is proportional to the product of their masses
        feedback: |
          That is Newton's law, which turns up as a low-speed, weak-field limit. The Einstein equation is a statement about the *geometry*, not about a force.
      - text: Matter moves along geodesics of a fixed, unchanging spacetime
        feedback: |
          Geodesic motion is true for free particles, but the equation says more: the spacetime is **not** fixed, it responds to the matter in it.
    explanation: |
      John Wheeler's summary: *spacetime tells matter how to move; matter tells spacetime how to curve.* Geodesics give the first half, the Einstein equation the second.

  - type: numeric
    id: count
    prompt: |
      In four dimensions, $G_{ab}$ and $T_{ab}$ are symmetric: $G_{ab} = G_{ba}$. How many independent components does a symmetric $4\times 4$ array have? (So how many equations does $G_{ab} = 8\pi G_N T_{ab}$ contain?)
    answer: 10
    answerText: '10'
    wrong:
      - value: 16
        feedback: |
          $16$ counts all entries, but symmetry makes $G_{ab}$ and $G_{ba}$ the same equation.
      - value: 6
        feedback: |
          $6$ counts only the off-diagonal pairs. Add the $4$ diagonal entries.
    hint: |
      Diagonal entries, plus one for each pair of different indices.
    explanation: |
      $4 + \tfrac{4\cdot 3}{2} = 10$ equations, for the 10 independent components of the metric. (Four identities, tied to energy–momentum conservation, make only 6 of them independent.) Ten coupled nonlinear equations: this is why solutions like the Schwarzschild black hole are rare and precious.

  - type: text
    id: sentence-recall
    title: The sentence, decoded
    body: |
      Each puzzle forced one phrase of the opening sentence into existence:

      | Phrase | The puzzle it solves |
      |---|---|
      | topological manifold | a space that is only *locally* flat, with charts as labels |
      | smooth atlas | doing calculus when charts overlap |
      | connection (torsion-free) | differentiating vectors; "straight" without coordinates |
      | Lorentzian metric | lengths, durations, light cones |
      | Einstein equations | what makes spacetime curve |

  - type: mcq
    id: which-calculus
    prompt: |
      In "a topological manifold with a smooth atlas carrying a connection compatible with a metric", which ingredient is the one that lets us differentiate **functions** on the space in a chart-independent way?
    options:
      - text: The smooth atlas
        correct: true
      - text: The metric
        feedback: |
          The metric measures lengths and durations. Differentiating a function needs only that overlapping charts are smoothly related.
      - text: The Einstein equations
        feedback: |
          They govern how matter curves spacetime, and come at the very end.
      - text: The topology alone
        feedback: |
          Topology gives continuity, a vague notion of "nearby", but not derivatives. Smoothness of the chart changes is what makes calculus consistent.
    explanation: |
      Levels 3 and 4: a topology gives continuity, a smooth atlas gives differentiability, and the tangent spaces give vectors as derivatives of functions along curves.

  - type: mcq
    id: which-clocks
    prompt: |
      Which ingredient of the opening sentence tells us how much time a clock records along a worldline?
    options:
      - text: The Lorentzian metric
        correct: true
      - text: The connection
        feedback: |
          A connection tells you what "straight" means and how to differentiate, but not how long a path is. Metric and connection are *a priori* independent structures.
      - text: The smooth atlas
        feedback: |
          The atlas lets us do calculus. It does not give any notion of length or duration.
      - text: The orientation
        feedback: |
          Orientation (and time orientation) distinguishes directions but gives no measure of length or duration.
    explanation: |
      The metric (Level 7) gives lengths, angles, durations and the light-cone structure, and its Levi-Civita connection links geodesics of "straight" and "extremal proper time".

  - type: order
    id: build-order
    prompt: Put the building blocks of the course in the order in which each one is built on the previous ones.
    steps:
      - 'Sets, maps, vector spaces, covectors and tensors'
      - 'Topological and smooth manifolds: charts and atlases'
      - 'Tangent and cotangent spaces at each point'
      - 'Vector, covector and tensor fields'
      - 'A connection: covariant derivative, torsion, curvature'
      - 'A metric: lengths, geodesics, the Levi-Civita connection'
      - 'Volume forms and integration'
      - 'Gravity as geometry in Newtonian spacetime'
      - 'Spacetime and the Einstein equations'
    hint: |
      Each step uses only what was built before it. Curvature needs a connection, which needs fields to differentiate.
    explanation: |
      That is the course, Level by Level: **2** vector spaces, **3** manifolds, **4** tangent spaces, **5** fields, **6** the covariant derivative, **7** the metric, **8** integrals, **9** Newton–Cartan theory, **10** general relativity. Each Level starts from a puzzle like today's and ends with tools you can compute with.

  - type: text
    id: how-it-works
    title: How the course works
    body: |
      Every Level (one per chapter) follows the same pattern:

      | Lesson | What you do |
      |---|---|
      | **Concept** | start from a problem you cannot yet solve, build the idea, return to solve it |
      | **Guided problem** | one substantial result, derived step by step |
      | **Traps** | quick questions, each built on a common misconception |
      | **Intuition** | recall the main formulas through mnemonics and small checks |
      | **Content map** | rebuild the chapter's concept map among decoys |
      | **Review** | spaced repetition of every question you have answered |
      | **Challenge** | harder problems combining the whole Level |

      Wrong answers are not failures: each one encodes a real misconception, and the feedback explains why it is tempting. Questions you miss come back in the review.

  - type: mcq
    id: myth-force
    prompt: |
      True or false: in general relativity, gravity is a force that pulls freely falling particles off their straight paths.
    shuffle: false
    options:
      - text: False; free particles follow the straightest paths of the curved spacetime, and no force acts on them
        correct: true
      - text: True; it is just a different formula for the same Newtonian force
        feedback: |
          A freely falling particle feels nothing (the elevator!). What looks like a deflection to a distant observer is straightness in a curved geometry.
    explanation: |
      Only **non-free** objects (those held up, pushed or accelerated) feel forces. A person standing on the ground feels the floor pushing up: that is the real force, which prevents her from following her natural path.

  - type: mcq
    id: myth-vacuum
    prompt: |
      True or false: where there is no matter at all (empty space), spacetime is flat.
    shuffle: false
    options:
      - text: False; empty space can be curved, as around a star outside its surface
        correct: true
      - text: True; curvature is caused by matter, so none means none
        feedback: |
          Matter at *other* places can curve the surrounding empty region. The tides near a mass (Puzzle 1) occur in empty space, and the Schwarzschild solution is a vacuum spacetime that is curved everywhere.
    explanation: |
      In the Einstein equation, empty space means $T_{ab} = 0$, which gives $G_{ab} = 0$, not "flat". Flat space is one solution; Schwarzschild (Level 10) is another.

  - type: mcq
    id: myth-tensor
    prompt: |
      True or false: if a tensor equation holds in one chart, it holds in every chart.
    shuffle: false
    options:
      - text: True; this is the reason physical laws are written with tensors
        correct: true
      - text: False; each chart needs its own check
        feedback: |
          That would be the case for equations between arbitrary lists of numbers. Tensor components change by a common rule, so a relation true in one chart is true in all.
    explanation: |
      This is the reward for the abstract work of Levels 2 to 5: laws written as tensor equations are automatically free of the observer's choice of labels.

  - type: text
    id: questions
    title: Questions to carry with you
    body: |
      Keep these in mind as you go. Each Level will answer some of them:

      1. *If free fall feels like nothing, what is gravity?* (6, 7, 10)
      2. *What is a coordinate, and what is physical?* (3, 4)
      3. *What is a vector, really, and why do covectors exist?* (2, 4)
      4. *How do you differentiate where there is no flat grid?* (6)
      5. *How do you detect curvature from inside?* (6)
      6. *What does "straight" mean, and what is the longest path?* (6, 7)
      7. *How do you integrate without a preferred coordinate system?* (8)
      8. *What of Newton survives, and what is new?* (9)
      9. *What decides how spacetime curves?* (10)

  - type: text
    id: summary
    body: |
      **Next:** Level 2 begins at the algebraic root of everything: sets, maps and vector spaces. The first question is humble and will turn out to be deep: *when can a change of description be undone?*
